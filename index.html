<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوامي</title>
<meta name="theme-color" content="#0f8c77">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دوامي">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --text:#20242e; --muted:#7a8191; --line:#e9e4da;
  --accent:#0f8c77; --accent-soft:#e0f2ed;
  --work:#0f8c77; --work-bg:#ddf1ea; --work-fg:#0a5c4e;
  --off:#d6578a;  --off-bg:#fbe9f1;  --off-fg:#a23563;
  --shadow:0 2px 14px rgba(40,40,60,.07);
}
[data-theme="dark"]{
  --bg:#101420; --card:#1a2030; --text:#eceff6; --muted:#98a0b3; --line:#2a3145;
  --accent:#2fc3a6; --accent-soft:#143c35;
  --work:#2fc3a6; --work-bg:#15383387; --work-fg:#7fe3cd;
  --off:#f084b2;  --off-bg:#43243587;  --off-fg:#f5aecb;
  --shadow:0 2px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition:background .25s,color .25s}
.wrap{max-width:440px;margin:0 auto;padding:10px 14px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 6px}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:22px;font-weight:800;margin:0}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.actions{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text);display:grid;place-items:center;font-size:17px;cursor:pointer;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.hero{padding:16px 18px;margin-top:6px}
.hero-top{display:flex;align-items:center;justify-content:space-between}
.hero-weekday{font-size:18px;font-weight:800}
.pill{padding:4px 14px;border-radius:99px;font-weight:800;font-size:14px}
.pill.work{background:var(--work-bg);color:var(--work-fg)}
.pill.off{background:var(--off-bg);color:var(--off-fg)}
.hero-date{font-size:26px;font-weight:800;margin-top:2px}
.hero-hijri{color:var(--muted);font-size:14px;margin-top:2px}
.hero-pattern{color:var(--muted);font-size:12.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.next-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.next{padding:12px 14px}
.nx-label{font-size:12.5px;color:var(--muted);font-weight:700}
.next.work .nx-label::before{content:"●  ";color:var(--work)}
.next.off .nx-label::before{content:"●  ";color:var(--off)}
.nx-date{font-size:15.5px;font-weight:800;margin-top:2px;line-height:1.35}
.nx-rel{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;border-radius:8px;padding:1px 8px}
.next.work .nx-rel{background:var(--work-bg);color:var(--work-fg)}
.next.off .nx-rel{background:var(--off-bg);color:var(--off-fg)}
.sum{margin-top:10px;padding:10px 14px;display:flex;justify-content:center;gap:14px;font-size:13.5px;font-weight:700;flex-wrap:wrap}
.sum .w{color:var(--work-fg)}.sum .o{color:var(--off-fg)}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:14px;padding:4px;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14.5px;font-weight:700;padding:9px 0;border-radius:10px;cursor:pointer}
.tabs button.active{background:var(--accent);color:#fff}
.view{margin-top:12px}
.hidden{display:none !important}
.cal-card{padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.today-chip{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:0;border-radius:8px;padding:3px 10px;font-family:inherit;cursor:pointer}
.nav-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;cursor:pointer;font-family:inherit}
.wd-row,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd-row div{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.cell{position:relative;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;cursor:pointer;border:2px solid transparent;user-select:none;-webkit-user-select:none}
.cell.work{background:var(--work-bg);color:var(--work-fg)}
.cell.off{background:var(--off-bg);color:var(--off-fg)}
.cell.blank{background:transparent;cursor:default}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cell.ov::after{content:"";position:absolute;top:5px;left:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:4px;display:inline-block}
.dot.w{background:var(--work)}.dot.o{background:var(--off)}
.dot.v{background:var(--card);border:2px solid var(--accent);width:9px;height:9px;border-radius:50%}
.grid-sum{text-align:center;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:10px}
.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{padding:10px;cursor:pointer}
.mini h4{margin:0 0 6px;font-size:13px;font-weight:800;text-align:center;color:var(--text)}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .mc{aspect-ratio:1;border-radius:3px}
.mini .mc.work{background:var(--work)}
.mini .mc.off{background:var(--off);opacity:.38}
.mini .mc.blank{background:transparent}
.mini .mc.today{outline:2px solid var(--accent);outline-offset:1px}
.up-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
.up-row:last-child{border-bottom:0}
.up-right{display:flex;flex-direction:column}
.up-day{font-weight:800;font-size:14.5px}
.up-date{color:var(--muted);font-size:12px}
.up-chip{font-size:12.5px;font-weight:800;border-radius:99px;padding:3px 12px}
.up-chip.work{background:var(--work-bg);color:var(--work-fg)}
.up-chip.off{background:var(--off-bg);color:var(--off-fg)}
.up-today{font-size:11px;color:var(--accent);font-weight:700;margin-inline-start:6px}
.backdrop{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:40;opacity:1;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.18);
  transform:translateY(0);transition:transform .22s}
.sheet.hidden-anim{transform:translateY(110%)}
.handle{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:17px;font-weight:800;margin:0 0 12px}
.ds-head{margin-bottom:12px}
.ds-title{font-size:17px;font-weight:800}
.ds-hijri{color:var(--muted);font-size:13px;margin:2px 0 8px}
.ds-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.act{border:0;border-radius:13px;padding:12px 0;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer}
.act.work{background:var(--work-bg);color:var(--work-fg)}
.act.off{background:var(--off-bg);color:var(--off-fg)}
.act.clear{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.act.sel{outline:2.5px solid var(--accent)}
.hint{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.6}
.set-label{font-size:13.5px;font-weight:700;color:var(--muted);margin:14px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:7px 14px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--work-bg);border-color:var(--work);color:var(--work-fg)}
.btn{width:100%;border:0;border-radius:13px;padding:13px 0;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:#d8544f;border:1px dashed #d8544f88}
.toast{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 20px;border-radius:99px;font-size:13.5px;font-weight:700;opacity:0;transition:all .25s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.print-head{display:none}
@media print{
  body{background:#fff;color:#000}
  header.top,.tabs,.next-grid,.sum,.hero,.legend,.today-chip,.nav-btn,#view-list,#view-year{display:none !important}
  .print-head{display:block;text-align:center;font-weight:800;font-size:18px;margin-bottom:8px}
  #view-month{display:block !important}
  .card{box-shadow:none;border-color:#ccc}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      </div>
      <h1>دوامي</h1>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnTheme" aria-label="الوضع الليلي">🌙</button>
      <button class="icon-btn" id="btnShare" aria-label="مشاركة">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
      </button>
      <button class="icon-btn" id="btnPrint" aria-label="طباعة">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><path d="M7 14h10v7H7z"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="الإعدادات">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="card hero">
    <div class="hero-top">
      <span class="hero-weekday" id="todayWeekday"></span>
      <span class="pill" id="todayStatus"></span>
    </div>
    <div class="hero-date" id="todayGreg"></div>
    <div class="hero-hijri" id="todayHijri"></div>
    <div class="hero-pattern" id="patternLine"></div>
  </section>

  <section class="next-grid">
    <div class="card next work">
      <div class="nx-label">الدوام القادم</div>
      <div class="nx-date" id="nextWorkDate">—</div>
      <span class="nx-rel" id="nextWorkRel"></span>
    </div>
    <div class="card next off">
      <div class="nx-label">الإجازة القادمة</div>
      <div class="nx-date" id="nextOffDate">—</div>
      <span class="nx-rel" id="nextOffRel"></span>
    </div>
  </section>

  <section class="card sum" id="sumCard"><span id="sumText"></span></section>

  <nav class="tabs">
    <button data-tab="month" class="active">الشهر</button>
    <button data-tab="year">السنة</button>
    <button data-tab="list">الأيام القادمة</button>
  </nav>

  <section id="view-month" class="view card cal-card">
    <div class="print-head" id="printHead"></div>
    <div class="cal-head">
      <button class="nav-btn" id="prevM">›</button>
      <div class="cal-title"><span id="calTitle"></span><button class="today-chip" id="btnToday">اليوم</button></div>
      <button class="nav-btn" id="nextM">‹</button>
    </div>
    <div class="wd-row" id="wdRow"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot w"></i> دوام</span>
      <span><i class="dot o"></i> إجازة</span>
      <span><i class="dot v"></i> معدَّل يدويًا</span>
    </div>
    <div class="grid-sum" id="gridSum"></div>
  </section>

  <section id="view-year" class="view hidden">
    <div class="card cal-card">
      <div class="cal-head">
        <button class="nav-btn" id="prevY">›</button>
        <div class="cal-title" id="yearTitle"></div>
        <button class="nav-btn" id="nextY">‹</button>
      </div>
      <div class="year-grid" id="yearGrid"></div>
    </div>
  </section>

  <section id="view-list" class="view card hidden" id="upCard"><div id="upList"></div></section>
</div>

<div class="backdrop hidden" id="backdrop"></div>

<div class="sheet hidden hidden-anim" id="daySheet">
  <div class="handle"></div>
  <div class="ds-head">
    <div class="ds-title" id="dsTitle"></div>
    <div class="ds-hijri" id="dsHijri"></div>
    <span class="pill" id="dsStatus"></span>
  </div>
  <div class="ds-actions">
    <button class="act work" id="dsWork">دوام</button>
    <button class="act off" id="dsOff">إجازة</button>
    <button class="act clear" id="dsClear">حسب الجدول</button>
  </div>
  <p class="hint">التعديل اليدوي يغيّر هذا اليوم فقط ويُحفَظ تلقائيًا على جهازج.</p>
</div>

<div class="sheet hidden hidden-anim" id="settingsSheet">
  <div class="handle"></div>
  <h2>الإعدادات</h2>
  <div class="set-label">أيام الدوام في الأسبوع</div>
  <div class="chips" id="wkChips"></div>
  <button class="btn danger" id="stClearOv">مسح كل التعديلات اليدوية</button>
  <button class="btn primary" id="stDone">تم</button>
  <p class="hint">أي تغيير ينحفظ تلقائيًا، وما يضيع حتى لو سكّرتي الصفحة. باقي الأيام تُحسب إجازة تلقائيًا.</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var DAY=86400000;
var WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var WDS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var ORDER=[0,1,2,3,4,5,6]; // week starts Sunday

var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var settings=Object.assign({workDays:[5,6],theme:'auto'},store.get('dawami.settings',{}));
if(!Array.isArray(settings.workDays)||!settings.workDays.length) settings.workDays=[5,6];
var overrides=store.get('dawami.overrides',{});
function saveAll(){store.set('dawami.settings',settings);store.set('dawami.overrides',overrides)}

function sod(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
var hijriFmt;
try{hijriFmt=new Intl.DateTimeFormat('ar-AE-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){hijriFmt=null}
function hijri(d){try{return hijriFmt?hijriFmt.format(d)+' هـ':''}catch(e){return ''}}
function fmtFull(d){return WD[d.getDay()]+'، '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()}
function fmtShort(d){return WDS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}

function baseStatus(d){return settings.workDays.indexOf(d.getDay())>-1?'work':'off'}
function status(d){var o=overrides[iso(d)];return o||baseStatus(d)}
function isOverridden(d){return !!overrides[iso(d)]}

function nextDay(target,from){
  var d=addDays(from,1);
  for(var i=0;i<400;i++){if(status(d)===target)return d;d=addDays(d,1)}
  return null;
}
function relTxt(n){
  if(n<=0)return 'اليوم';
  if(n===1)return 'غدًا';
  if(n===2)return 'بعد يومين';
  if(n<=10)return 'بعد '+n+' أيام';
  return 'بعد '+n+' يوم';
}
function diffDays(a,b){return Math.round((sod(b)-sod(a))/DAY)}
function monthCounts(y,m){
  var days=new Date(y,m+1,0).getDate(),w=0,o=0;
  for(var i=1;i<=days;i++){status(new Date(y,m,i))==='work'?w++:o++}
  return {w:w,o:o};
}
function patternText(){
  var names=settings.workDays.slice().sort(function(a,b){return ORDER.indexOf(a)-ORDER.indexOf(b)}).map(function(i){return WD[i]});
  if(!names.length)return 'ما في أيام دوام محددة';
  return 'الدوام: '+names.join(' و')+' · وباقي الأسبوع إجازة';
}

/* ---------- state ---------- */
var now=sod(new Date());
var viewY=now.getFullYear(),viewM=now.getMonth(),yearY=now.getFullYear();
var sheetDate=null;

/* ---------- home ---------- */
function renderHome(){
  now=sod(new Date());
  $('#todayWeekday').textContent=WD[now.getDay()];
  $('#todayGreg').textContent=now.getDate()+' '+MONTHS[now.getMonth()]+' '+now.getFullYear();
  $('#todayHijri').textContent=hijri(now);
  var st=status(now),pill=$('#todayStatus');
  pill.textContent=st==='work'?'اليوم دوام':'اليوم إجازة';
  pill.className='pill '+st;
  $('#patternLine').textContent=patternText();
  var nw=nextDay('work',now),no=nextDay('off',now);
  $('#nextWorkDate').textContent=nw?fmtShort(nw):'—';
  $('#nextWorkRel').textContent=nw?relTxt(diffDays(now,nw)):'';
  $('#nextOffDate').textContent=no?fmtShort(no):'—';
  $('#nextOffRel').textContent=no?relTxt(diffDays(now,no)):'';
  var c=monthCounts(now.getFullYear(),now.getMonth());
  $('#sumText').innerHTML='شهر '+MONTHS[now.getMonth()]+': <span class="w">'+c.w+' يوم دوام</span> · <span class="o">'+c.o+' يوم إجازة</span>';
}

/* ---------- month ---------- */
function renderWd(){
  var h='';ORDER.forEach(function(i){h+='<div>'+WDS[i]+'</div>'});
  $('#wdRow').innerHTML=h;
}
function renderMonth(){
  $('#calTitle').textContent=MONTHS[viewM]+' '+viewY;
  $('#printHead').textContent='جدول الدوام والإجازات — '+MONTHS[viewM]+' '+viewY;
  var first=new Date(viewY,viewM,1);
  var offset=ORDER.indexOf(first.getDay());
  var days=new Date(viewY,viewM+1,0).getDate();
  var g=$('#grid');g.innerHTML='';
  for(var b=0;b<offset;b++){var e=document.createElement('div');e.className='cell blank';g.appendChild(e)}
  for(var i=1;i<=days;i++){
    (function(i){
      var d=new Date(viewY,viewM,i),st=status(d);
      var c=document.createElement('div');
      c.className='cell '+st+(iso(d)===iso(now)?' today':'')+(isOverridden(d)?' ov':'');
      c.textContent=i;
      c.addEventListener('click',function(){openDay(d)});
      g.appendChild(c);
    })(i);
  }
  var mc=monthCounts(viewY,viewM);
  $('#gridSum').textContent=mc.w+' يوم دوام · '+mc.o+' يوم إجازة';
}

/* ---------- year ---------- */
function renderYear(){
  $('#yearTitle').textContent='سنة '+yearY;
  var yg=$('#yearGrid');yg.innerHTML='';
  for(var m=0;m<12;m++){
    (function(m){
      var card=document.createElement('div');card.className='card mini';
      var h='<h4>'+MONTHS[m]+'</h4><div class="mg">';
      var first=new Date(yearY,m,1),offset=ORDER.indexOf(first.getDay());
      var days=new Date(yearY,m+1,0).getDate();
      for(var b=0;b<offset;b++)h+='<div class="mc blank"></div>';
      for(var i=1;i<=days;i++){
        var d=new Date(yearY,m,i);
        h+='<div class="mc '+status(d)+(iso(d)===iso(now)?' today':'')+'"></div>';
      }
      h+='</div>';
      card.innerHTML=h;
      card.addEventListener('click',function(){viewY=yearY;viewM=m;switchTab('month');renderMonth()});
      yg.appendChild(card);
    })(m);
  }
}

/* ---------- upcoming ---------- */
function renderList(){
  var ul=$('#upList');ul.innerHTML='';
  for(var i=0;i<30;i++){
    var d=addDays(now,i),st=status(d);
    var row=document.createElement('div');row.className='up-row';
    row.innerHTML='<div class="up-right"><span class="up-day">'+WD[d.getDay()]+(i===0?'<span class="up-today">اليوم</span>':(i===1?'<span class="up-today">غدًا</span>':''))+'</span>'+
      '<span class="up-date">'+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+'</span></div>'+
      '<span class="up-chip '+st+'">'+(st==='work'?'دوام':'إجازة')+'</span>';
    (function(d){row.addEventListener('click',function(){openDay(d)})})(d);
    ul.appendChild(row);
  }
}

/* ---------- tabs ---------- */
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.toggle('active',b.dataset.tab===name)});
  ['month','year','list'].forEach(function(t){$('#view-'+t).classList.toggle('hidden',t!==name)});
}
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click',function(){
    switchTab(b.dataset.tab);
    if(b.dataset.tab==='year')renderYear();
    if(b.dataset.tab==='list')renderList();
  });
});

/* ---------- sheets ---------- */
function openSheet(id){$('#backdrop').classList.remove('hidden');var s=$(id);s.classList.remove('hidden');requestAnimationFrame(function(){s.classList.remove('hidden-anim')})}
function closeSheets(){
  $('#backdrop').classList.add('hidden');
  ['#daySheet','#settingsSheet'].forEach(function(id){var s=$(id);s.classList.add('hidden-anim');setTimeout(function(){s.classList.add('hidden')},220)});
}
$('#backdrop').addEventListener('click',closeSheets);

function openDay(d){
  sheetDate=d;
  $('#dsTitle').textContent=fmtFull(d);
  $('#dsHijri').textContent=hijri(d);
  refreshDaySheet();
  openSheet('#daySheet');
}
function refreshDaySheet(){
  var st=status(sheetDate),p=$('#dsStatus');
  p.textContent=st==='work'?'دوام':'إجازة';p.className='pill '+st;
  var ov=overrides[iso(sheetDate)];
  $('#dsWork').classList.toggle('sel',ov==='work');
  $('#dsOff').classList.toggle('sel',ov==='off');
  $('#dsClear').classList.toggle('sel',!ov);
}
function setOverride(val){
  var k=iso(sheetDate);
  if(val===null){delete overrides[k]}else{
    if(baseStatus(sheetDate)===val){delete overrides[k]}else{overrides[k]=val}
  }
  saveAll();refreshDaySheet();rerender();
  toast(val===null?'رجع حسب الجدول':'تم الحفظ ✓');
}
$('#dsWork').addEventListener('click',function(){setOverride('work')});
$('#dsOff').addEventListener('click',function(){setOverride('off')});
$('#dsClear').addEventListener('click',function(){setOverride(null)});

/* ---------- settings ---------- */
function renderChips(){
  var box=$('#wkChips');box.innerHTML='';
  ORDER.forEach(function(i){
    var b=document.createElement('button');
    b.className='chip'+(settings.workDays.indexOf(i)>-1?' on':'');
    b.textContent=WD[i];
    b.addEventListener('click',function(){
      var idx=settings.workDays.indexOf(i);
      if(idx>-1){settings.workDays.splice(idx,1)}else{settings.workDays.push(i)}
      saveAll();renderChips();rerender();
    });
    box.appendChild(b);
  });
}
$('#btnSettings').addEventListener('click',function(){renderChips();openSheet('#settingsSheet')});
$('#stDone').addEventListener('click',closeSheets);
$('#stClearOv').addEventListener('click',function(){
  overrides={};saveAll();rerender();toast('انمسحت كل التعديلات');
});

/* ---------- header actions ---------- */
function applyTheme(){
  var t=settings.theme;
  if(t==='auto'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
  document.documentElement.setAttribute('data-theme',t);
  $('#btnTheme').textContent=t==='dark'?'☀️':'🌙';
}
$('#btnTheme').addEventListener('click',function(){
  var cur=document.documentElement.getAttribute('data-theme');
  settings.theme=cur==='dark'?'light':'dark';
  saveAll();applyTheme();
});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(settings.theme==='auto')applyTheme()})}catch(e){}

$('#btnShare').addEventListener('click',function(){
  var nw=nextDay('work',now),no=nextDay('off',now);
  var txt='جدول دوامي 🗓\nاليوم ('+fmtFull(now)+'): '+(status(now)==='work'?'دوام':'إجازة')+
    '\nالدوام القادم: '+(nw?fmtFull(nw):'—')+'\nالإجازة القادمة: '+(no?fmtFull(no):'—')+'\n'+location.href;
  if(navigator.share){navigator.share({title:'دوامي',text:txt}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('انسخ الجدول ✓')}).catch(function(){})}
});
$('#btnPrint').addEventListener('click',function(){switchTab('month');renderMonth();setTimeout(function(){try{window.print()}catch(e){toast('الطباعة غير متاحة هنا')}},100)});

/* ---------- nav ---------- */
$('#prevM').addEventListener('click',function(){viewM--;if(viewM<0){viewM=11;viewY--}renderMonth()});
$('#nextM').addEventListener('click',function(){viewM++;if(viewM>11){viewM=0;viewY++}renderMonth()});
$('#btnToday').addEventListener('click',function(){viewY=now.getFullYear();viewM=now.getMonth();renderMonth()});
$('#prevY').addEventListener('click',function(){yearY--;renderYear()});
$('#nextY').addEventListener('click',function(){yearY++;renderYear()});

/* ---------- misc ---------- */
var toastTimer;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1800)}
function rerender(){renderHome();renderMonth();if(!$('#view-year').classList.contains('hidden'))renderYear();if(!$('#view-list').classList.contains('hidden'))renderList()}
document.addEventListener('visibilitychange',function(){if(!document.hidden){var t=sod(new Date());if(iso(t)!==iso(now)){now=t;rerender()}}});

applyTheme();renderWd();renderHome();renderMonth();
})();
</script>
</body>
</html>
